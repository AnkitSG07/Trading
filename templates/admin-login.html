<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Xclusive Money</title>
    <style>
        :root {
            --bg: hsl(240, 20%, 97%);
            --card: #ffffff;
            --text: hsl(240, 10%, 15%);
            --muted: hsl(240, 4%, 46%);
            --accent: hsl(250, 70%, 60%);
            --border: hsl(240, 6%, 90%);
            --shadow: 0 10px 30px hsla(240, 10%, 20%, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: var(--text);
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 26rem;
            background: var(--card);
            padding: 2.25rem;
            border-radius: 1rem;
            box-shadow: var(--shadow);
        }

        h1 {
            margin: 0 0 0.35rem 0;
            font-size: 1.75rem;
        }

        .subtitle {
            margin: 0 0 1.75rem 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.85rem 0.9rem;
            border-radius: 0.65rem;
            border: 1px solid var(--border);
            font-size: 1rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px hsla(250, 70%, 60%, 0.15);
        }

        .field {
            margin-bottom: 1rem;
        }

        .error {
            margin-bottom: 1rem;
            padding: 0.85rem 1rem;
            border-radius: 0.65rem;
            background: hsla(0, 80%, 60%, 0.08);
            color: hsl(0, 70%, 40%);
            border: 1px solid hsla(0, 70%, 60%, 0.25);
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 0.9rem 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
            box-shadow: 0 10px 25px hsla(250, 70%, 60%, 0.3);
        }

        button:hover {
            background: hsl(250, 70%, 55%);
            transform: translateY(-1px);
            box-shadow: 0 14px 32px hsla(250, 70%, 60%, 0.35);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 8px 20px hsla(250, 70%, 60%, 0.25);
        }

        .meta {
            margin-top: 1rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main class="card" aria-labelledby="admin-login-heading">
        <h1 id="admin-login-heading">Admin Sign In</h1>
        <p class="subtitle">Use your admin credentials to access the dashboard.</p>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/adminlogin" autocomplete="on">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="email">Admin email</label>
                <input type="email" id="email" name="email" placeholder="admin@example.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit">Sign in</button>
        </form>

        <p class="meta">For authorized administrators only.</p>
    </main>
</body>
</html>
