<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Admin | XCLUSIVE MONEY{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="admin-shell d-flex">
    {% include 'admin/partials/sidebar.html' %}
    <div class="admin-main flex-grow-1 d-flex flex-column">
        {% include 'admin/partials/topbar.html' %}
        <main class="admin-content container-fluid py-4">
            {% include 'admin/partials/flash_messages.html' %}
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='admin/app.js') }}"></script>
    <script>
    (function attachCsrf() {
        const token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        window.adminCsrfToken = token;
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('form').forEach(function (form) {
                if (!form.querySelector('input[name="csrf_token"]')) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'csrf_token';
                    input.value = token;
                    form.appendChild(input);
                }
            });
        });
    })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
