{% extends 'admin/base.html' %}
{% block title %}Admin Settings{% endblock %}
{% block page_heading %}Platform Settings{% endblock %}
{% block content %}
<div class="row g-3">
    <div class="col-lg-6">
        <div class="card shadow-sm h-100">
            <div class="card-header fw-semibold">Authentication</div>
            <div class="card-body">
                <form method="post" action="{{ url_for('admin_settings') }}" class="vstack gap-3">
                    <div>
                        <label class="form-label" for="session_timeout">Session Timeout (minutes)</label>
                        <input class="form-control" id="session_timeout" name="session_timeout" type="number" min="5" value="{{ settings.get('session_timeout', 30) }}" required>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="1" id="mfa" name="mfa" {% if settings.get('mfa') %}checked{% endif %}>
                        <label class="form-check-label" for="mfa">Require MFA for admins</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="1" id="trading_enabled" name="trading_enabled" {% if settings.get('trading_enabled') %}checked{% endif %}>
                        <label class="form-check-label" for="trading_enabled">Enable trading</label>
                    </div>
                    <button class="btn btn-primary" type="submit">Save Security</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card shadow-sm h-100">
            <div class="card-header fw-semibold">Notifications</div>
            <div class="card-body">
                <form method="post" action="{{ url_for('admin_settings') }}" class="vstack gap-3">
                    <div>
                        <label class="form-label" for="webhook">Webhook URL</label>
                        <input class="form-control" id="webhook" name="webhook" type="url" value="{{ settings.get('webhook', '') }}" placeholder="https://example.com/hook" required>
                    </div>
                    <div>
                        <label class="form-label" for="email">Alert email</label>
                        <input class="form-control" id="email" name="email" type="email" value="{{ settings.get('email', '') }}" placeholder="ops@example.com" required>
                    </div>
                    <button class="btn btn-outline-primary" type="submit">Update Alerts</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
